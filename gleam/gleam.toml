name = "gha_indie_worker_pub_lib_core"
version = "0.1.0"
licences = ["MIT"]
description = "Public client-side core for GHA Indie Worker — the Gleam port of the shared client contract."
repository = { type = "github", user = "gha-indie-worker", repo = "gha-indie-worker-pub-lib-core" }
target = "erlang"

# Gleam is a first-class client language in this org alongside Rust, TypeScript
# and Dart. This package carries the pure, total parts of the contract: the
# onboarding state machines, the cursor format, the runtime-configuration keys
# and the resource types. Transport belongs to the host, exactly as in the other
# three ports.

[dependencies]
gleam_stdlib = ">= 0.38.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
