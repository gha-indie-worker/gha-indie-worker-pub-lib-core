name: Oreslang no-Python mirror validation
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - tmp/oreslang-no-python-1833-20261021
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tmp/oreslang-no-python-check/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tmp/oreslang-no-python-check/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path tmp/oreslang-no-python-check/Cargo.toml
      - name: Scan mirror repository
        run: cargo run --manifest-path tmp/oreslang-no-python-check/Cargo.toml -- .
