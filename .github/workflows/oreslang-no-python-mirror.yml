name: Oreslang no-Python mirror validation

on:
  pull_request:
  push:
    branches:
      - tmp/oreslang-no-python-1833-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tmp/oreslang-no-python-check/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tmp/oreslang-no-python-check/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path tmp/oreslang-no-python-check/Cargo.toml
      - name: Positive clean-repository proof
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/no-python-clean"
          mkdir -p "$clean/src"
          git -C "$clean" init -q
          printf 'fn main() {}\n' > "$clean/src/main.rs"
          git -C "$clean" add src/main.rs
          cargo run --manifest-path tmp/oreslang-no-python-check/Cargo.toml -- "$clean"
      - name: Negative Python-file proof
        run: |
          set -euo pipefail
          dirty="$RUNNER_TEMP/no-python-dirty"
          mkdir -p "$dirty"
          git -C "$dirty" init -q
          printf 'print("must be rejected")\n' > "$dirty/tool.py"
          git -C "$dirty" add tool.py
          if cargo run --manifest-path tmp/oreslang-no-python-check/Cargo.toml -- "$dirty"; then
            echo "checker incorrectly accepted Python" >&2
            exit 1
          fi
