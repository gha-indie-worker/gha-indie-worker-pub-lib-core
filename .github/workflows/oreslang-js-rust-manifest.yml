name: Oreslang JS Rust integration-manifest proof

on:
  pull_request:
  push:
    branches:
      - tmp/oreslang-source-js-rust-manifest-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tmp/oreslang-source.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/integration-manifest-check/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/integration-manifest-check/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path tools/integration-manifest-check/Cargo.toml
      - name: Real mirrored manifest gate
        run: cargo run --quiet --manifest-path tools/integration-manifest-check/Cargo.toml
