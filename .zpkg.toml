[package]
org = "gha-indie-worker"
name = "gha-indie-worker-pub-lib-core"
version = "0.1.0"
description = "Public client core for GHA Indie Worker: endpoint construction and retry policy, dependency-free"
license = "MIT"
language = "rust"
kind = "rust-lib"

[package.repository]
vcs = "git"
url = "https://github.com/gha-indie-worker/gha-indie-worker-pub-lib-core"

[dependencies]

[build]
command = "cargo build --release"

[scripts]
test = "cargo test --locked --all-targets"
lint = "cargo clippy --all-targets -- -D warnings"

[install]
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "target/**", "**/node_modules/**", "tmp/**", "**/*.log"]

[targets.rust]
dir = "."
adapter = "rust"
